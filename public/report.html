<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monthly Report | Mama Mia</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-stone-100 text-stone-900"><main class="mx-auto max-w-6xl p-4 md:p-8"><header class="mb-6 flex flex-wrap items-center justify-between gap-3"><div><h1 class="text-3xl font-bold">Monthly Sales Report</h1><p class="text-sm text-stone-500">Review monthly orders and download a PDF report.</p></div><div class="flex gap-2"><a href="/kds.html" class="rounded-lg bg-stone-800 px-4 py-2 text-sm font-bold text-white">Back to KDS</a><button onclick="downloadPdf()" class="rounded-lg bg-emerald-700 px-4 py-2 text-sm font-bold text-white">Download PDF</button></div></header><section class="mb-6 flex flex-wrap items-end gap-3 rounded-xl bg-white p-4 shadow"><label class="text-sm font-semibold">Select month<input id="month" type="month" class="mt-1 block rounded-lg border p-2" onchange="loadReport()"></label><span id="message" class="text-sm text-stone-500"></span></section><section id="summary" class="mb-6 grid grid-cols-2 gap-3 md:grid-cols-5"></section><section class="rounded-xl bg-white p-4 shadow"><h2 class="mb-3 text-xl font-bold">Item sales</h2><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead><tr class="border-b"><th class="p-2">Item</th><th class="p-2">Quantity</th><th class="p-2">Revenue</th></tr></thead><tbody id="items"></tbody></table></div></section></main><script>
let report;
const monthInput=document.getElementById('month');
const now=new Date(); monthInput.value=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
function money(n){return `₹${Number(n||0).toFixed(2)}`;}
async function loadReport(){const month=monthInput.value;document.getElementById('message').textContent='Loading...';try{const r=await fetch(`/api/reports/monthly?month=${encodeURIComponent(month)}`,{cache:'no-store'});if(!r.ok)throw new Error('Could not load report');report=await r.json();const s=report.summary;document.getElementById('summary').innerHTML=[['Orders',s.orderCount],['Total sales',money(s.totalSales)],['Completed',s.completedCount],['Pending/other',s.pendingCount],['Items sold',s.itemCount]].map(x=>`<div class="rounded-xl bg-white p-4 shadow"><p class="text-xs text-stone-500">${x[0]}</p><p class="mt-1 text-xl font-bold">${x[1]}</p></div>`).join('');document.getElementById('items').innerHTML=report.items.length?report.items.map(i=>`<tr class="border-b"><td class="p-2">${i.name}</td><td class="p-2">${i.quantity}</td><td class="p-2">${money(i.revenue)}</td></tr>`).join(''):'<tr><td colspan="3" class="p-4 text-center text-stone-500">No orders for this month.</td></tr>';document.getElementById('message').textContent=`${report.orders.length} order(s) found`;}catch(e){document.getElementById('message').textContent=e.message;}}
function downloadPdf(){if(!monthInput.value)return;window.location.href=`/api/reports/monthly.pdf?month=${encodeURIComponent(monthInput.value)}`;}
loadReport();
</script></body></html>
