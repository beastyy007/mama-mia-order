<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KDS | Mama Mia Artisan Kitchen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-stone-900 text-stone-100 min-h-screen p-6">
    <div id="kds-login" class="fixed inset-0 z-50 flex items-center justify-center bg-stone-950 p-6">
        <form onsubmit="unlockKds(event)" class="w-full max-w-sm rounded-2xl border border-stone-700 bg-stone-900 p-6 text-center shadow-2xl">
            <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-full bg-amber-500 text-2xl text-stone-950">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="mb-1 text-xl font-bold text-amber-500">KDS Access</h1>
            <p class="mb-5 text-sm text-stone-400">Enter the kitchen password to continue.</p>
            <input id="kds-password" type="password" autocomplete="current-password" required autofocus
                class="mb-3 w-full rounded-xl border border-stone-700 bg-stone-800 px-4 py-3 text-center text-white outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-500/30"
                placeholder="Password">
            <p id="kds-login-error" class="mb-3 hidden text-xs text-red-400">Incorrect password. Try again.</p>
            <button type="submit" class="w-full rounded-xl bg-amber-600 px-4 py-3 font-bold text-stone-950 transition hover:bg-amber-500">Unlock KDS</button>
        </form>
    </div>

    <div id="kds-app" class="hidden">
        <header class="mb-5 border-b border-stone-800 pb-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div>
                    <h1 class="text-2xl font-bold font-serif text-amber-500">Mama Mia Kitchen Display System (KDS)</h1>
                    <p class="text-xs text-stone-400">Live incoming orders from tables</p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <span id="connection-status" class="rounded-full bg-stone-800 px-3 py-2 text-xs text-stone-400"><i class="fa-solid fa-circle mr-1 text-green-400"></i> Connected</span>
                    <button onclick="toggleFullscreen()" class="rounded-xl bg-stone-700 px-3 py-2 text-xs font-bold hover:bg-stone-600"><i class="fa-solid fa-expand"></i> Full screen</button>
                    <button onclick="toggleSound()" id="sound-button" class="rounded-xl bg-stone-700 px-3 py-2 text-xs font-bold hover:bg-stone-600"><i class="fa-solid fa-volume-high"></i> Sound on</button>
                    <button onclick="fetchOrders()" id="refresh-button" class="rounded-xl bg-amber-600 px-4 py-2 text-xs font-bold text-stone-950 shadow hover:bg-amber-500"><i class="fa-solid fa-rotate"></i> Refresh</button>
                    <a href="/report.html" class="rounded-xl bg-emerald-700 px-4 py-2 text-xs font-bold text-white shadow hover:bg-emerald-600"><i class="fa-solid fa-file-pdf"></i> Monthly report</a>
                </div>
            </div>
            <div class="mt-4 grid grid-cols-1 gap-2 sm:grid-cols-3">
                <input id="order-search" oninput="drawOrders()" type="search" placeholder="Search table, name, or order ID..." class="rounded-xl border border-stone-700 bg-stone-800 px-4 py-2.5 text-sm outline-none focus:border-amber-500">
                <select id="status-filter" onchange="drawOrders()" class="rounded-xl border border-stone-700 bg-stone-800 px-4 py-2.5 text-sm outline-none focus:border-amber-500">
                    <option value="active">Active orders</option>
                    <option value="all">All orders</option>
                    <option value="Pending">New</option>
                    <option value="Preparing">Preparing</option>
                    <option value="Ready">Ready</option>
                    <option value="Completed">Completed</option>
                </select>
                <div class="flex items-center justify-between rounded-xl bg-stone-800 px-4 py-2.5 text-xs text-stone-400">
                    <span><b id="active-count" class="text-amber-400">0</b> active</span>
                    <span>Last update: <b id="last-updated" class="text-stone-300">--</b></span>
                </div>
            </div>
            <div class="mt-3 flex flex-wrap gap-2 text-xs">
                <span class="rounded-full bg-green-500/20 px-3 py-1 text-green-300">● Under 10 min</span>
                <span class="rounded-full bg-yellow-500/20 px-3 py-1 text-yellow-300">● 10–20 min</span>
                <span class="rounded-full bg-red-500/20 px-3 py-1 text-red-300">● Over 20 min</span>
            </div>
        </header>

        <div id="connection-error" class="mb-4 hidden rounded-xl border border-red-500/40 bg-red-500/10 p-3 text-sm text-red-300">
            <i class="fa-solid fa-triangle-exclamation mr-2"></i>Connection lost. Retrying automatically...
        </div>
        <div id="kds-orders" class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
    </div>

    <script>
        const KDS_PASSWORD = 'madhuu';
        let currentOrders = [];
        const gstRates = {};
        let soundEnabled = true;
        let lastOrderIds = new Set();
        let audioContext;
        let pollingStarted = false;
        const ACTIVE_STATUSES = ['Pending', 'Preparing', 'Preparing (Partial)', 'Ready'];

        function unlockKds(event) {
            event.preventDefault();
            const input = document.getElementById('kds-password');
            const error = document.getElementById('kds-login-error');
            if (input.value !== KDS_PASSWORD) {
                error.classList.remove('hidden');
                input.value = '';
                input.focus();
                return;
            }
            error.classList.add('hidden');
            document.getElementById('kds-login').classList.add('hidden');
            document.getElementById('kds-app').classList.remove('hidden');
            fetchOrders();
            if (!pollingStarted) {
                pollingStarted = true;
                setInterval(fetchOrders, 60000);
                setInterval(updateTimers, 1000);
            }
        }

        function setConnection(ok) {
            const badge = document.getElementById('connection-status');
            document.getElementById('connection-error').classList.toggle('hidden', ok);
            badge.innerHTML = ok
                ? '<i class="fa-solid fa-circle mr-1 text-green-400"></i> Connected'
                : '<i class="fa-solid fa-circle mr-1 text-red-400"></i> Offline';
            badge.className = `rounded-full px-3 py-2 text-xs ${ok ? 'bg-stone-800 text-stone-400' : 'bg-red-500/20 text-red-300'}`;
        }

        function statusName(status) {
            return status === 'Preparing (Partial)' ? 'Preparing' : (status || 'Pending');
        }

        function age(order) {
            const nativeDate = new Date(order.timestamp);
            if (!Number.isNaN(nativeDate.getTime())) {
                return Math.max(0, Math.floor((Date.now() - nativeDate.getTime()) / 60000));
            }
            const match = String(order.timestamp || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4}),?\s*(\d{1,2}):(\d{2}):(\d{2})\s*(am|pm)$/i);
            if (!match) return 0;
            let hour = Number(match[4]);
            if (match[7].toLowerCase() === 'pm' && hour < 12) hour += 12;
            if (match[7].toLowerCase() === 'am' && hour === 12) hour = 0;
            const date = new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]), hour, Number(match[5]), Number(match[6]));
            return Math.max(0, Math.floor((Date.now() - date.getTime()) / 60000));
        }

        function ageStyle(minutes) {
            return minutes >= 20
                ? 'text-red-300 bg-red-500/20 border-red-500/50'
                : minutes >= 10
                ? 'text-yellow-300 bg-yellow-500/20 border-yellow-500/50'
                : 'text-green-300 bg-green-500/20 border-green-500/50';
        }

        function safe(value) {
            return String(value ?? '').replace(/[&<>'"]/g, c => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[c]));
        }

        function drawOrders() {
            const query = document.getElementById('order-search').value.toLowerCase().trim();
            const filter = document.getElementById('status-filter').value;
            const active = currentOrders.filter(o => ACTIVE_STATUSES.includes(o.status));
            document.getElementById('active-count').textContent = active.length;

            const orders = currentOrders.filter(o => {
                const status = statusName(o.status);
                const matchesFilter = filter === 'active'
                    ? ACTIVE_STATUSES.includes(o.status)
                    : filter === 'all' || status === filter;
                const text = `${o.id} ${o.table} ${o.customerName || ''} ${o.customerPhone || ''}`.toLowerCase();
                return matchesFilter && text.includes(query);
            });

            const container = document.getElementById('kds-orders');
            if (!orders.length) {
                container.innerHTML = '<div class="col-span-full rounded-2xl border border-stone-800 bg-stone-800/50 py-16 text-center text-stone-500"><i class="fa-solid fa-utensils mb-3 text-4xl"></i><p>No matching orders.</p></div>';
                return;
            }

            container.innerHTML = orders.map(o => {
                const minutes = age(o);
                const status = statusName(o.status);
                const options = ['Pending', 'Preparing', 'Ready', 'Completed']
                    .map(s => `<option value="${s}" ${s === status ? 'selected' : ''}>${s}</option>`)
                    .join('');
                const readyAction = status !== 'Completed'
                    ? `<button onclick="notifyReady('${safe(o.id)}')" class="rounded-lg bg-green-600 px-2.5 py-1.5 text-xs font-bold hover:bg-green-500"><i class="fa-brands fa-whatsapp"></i> Ready selected</button>`
                    : '';
                const gstRate = Number(gstRates[o.id] ?? 0);
                const gstOptions = [0, 5, 12, 18, 28]
                    .map(rate => `<option value="${rate}" ${rate === gstRate ? 'selected' : ''}>GST ${rate}%</option>`)
                    .join('');
                const billAction = status === 'Completed'
                    ? `<button onclick="printEBill('${safe(o.id)}')" class="rounded-lg bg-blue-600 px-2.5 py-1.5 text-xs font-bold hover:bg-blue-500"><i class="fa-solid fa-file-pdf"></i> E-bill PDF</button>`
                    : '';

                return `
                <article data-order-id="${safe(o.id)}" class="flex flex-col justify-between rounded-2xl border ${minutes >= 20 ? 'border-red-500/60' : minutes >= 10 ? 'border-yellow-500/60' : 'border-stone-700'} bg-stone-800 p-5 shadow-xl">
                    <div>
                        <div class="mb-3 flex justify-between">
                            <span class="rounded-full bg-amber-500 px-3 py-1 text-xs font-bold text-stone-950">Table #${safe(o.table)}</span>
                            <span class="rounded-full bg-amber-500/20 px-2.5 py-1 text-xs font-semibold text-amber-300">${safe(o.status || 'Pending')}</span>
                        </div>
                        <div class="mb-3 flex items-center justify-between">
                            <div>
                                <b>${safe(o.customerName || 'Guest')}</b>
                                ${o.customerPhone ? `<div class="text-xs text-stone-400">${safe(o.customerPhone)}</div>` : ''}
                            </div>
                            <span data-age="${safe(o.id)}" class="rounded-lg border px-2 py-1 text-xs font-bold ${ageStyle(minutes)}">${minutes} min</span>
                        </div>
                        ${o.notes ? `<div class="mb-3 rounded-xl border border-red-500/40 bg-red-500/10 p-2.5 text-xs text-red-300"><b>Note:</b> ${safe(o.notes)}</div>` : ''}
                        <div class="mb-4 border-t border-stone-700 pt-3">
                            <p class="mb-2 text-xs font-semibold text-stone-400">Tick items that are ready</p>
                            <ul class="space-y-1.5 text-sm">
                                ${(o.items || []).map((i, index) => `
                                    <li class="flex items-center justify-between rounded-lg bg-stone-900/40 px-2.5 py-1.5">
                                        <label class="flex flex-1 cursor-pointer items-center gap-2">
                                            <input type="checkbox" data-ready-for="${safe(o.id)}" data-item-index="${index}" class="h-4 w-4 accent-green-500">
                                            <span>${safe(i.name)}</span>
                                        </label>
                                        <b class="text-amber-400">x${safe(i.qty)}</b>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center justify-between gap-2 border-t border-stone-700 pt-3">
                        <span class="text-sm font-bold">Total: <span class="text-amber-400">₹${safe(o.total)}</span></span>
                        <div class="flex flex-wrap justify-end gap-2">
                            <select onchange="setGstRate('${safe(o.id)}', this.value)" class="rounded-lg border border-stone-600 bg-stone-900 px-2 py-1.5 text-xs font-bold" aria-label="GST rate">${gstOptions}</select>
                            <select onchange="setOrderStatus('${safe(o.id)}', this.value)" class="rounded-lg border border-stone-600 bg-stone-900 px-2 py-1.5 text-xs font-bold">${options}</select>
                            ${readyAction}
                            ${billAction}
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

        async function fetchOrders() {
            try {
                const r = await fetch('/api/orders', { cache: 'no-store' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                const data = await r.json();
                const incoming = data.filter(o => !lastOrderIds.has(o.id) && o.status === 'Pending');
                if (lastOrderIds.size && incoming.length) playAlert();
                lastOrderIds = new Set(data.map(o => o.id));
                currentOrders = Array.isArray(data) ? data : [];
                setConnection(true);
                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString();
                drawOrders();
            } catch (err) {
                console.error(err);
                setConnection(false);
            }
        }

        function updateTimers() {
            currentOrders.forEach(order => {
                const node = document.querySelector(`[data-age="${CSS.escape(String(order.id))}"]`);
                if (!node) return;
                const minutes = age(order);
                node.textContent = `${minutes} min`;
                node.className = `rounded-lg border px-2 py-1 text-xs font-bold ${ageStyle(minutes)}`;
            });
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-button').innerHTML = soundEnabled
                ? '<i class="fa-solid fa-volume-high"></i> Sound on'
                : '<i class="fa-solid fa-volume-xmark"></i> Sound off';
        }

        function playAlert() {
            if (!soundEnabled) return;
            try {
                audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume();
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                oscillator.frequency.value = 880;
                gain.gain.value = 0.08;
                oscillator.connect(gain);
                gain.connect(audioContext.destination);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.25);
            } catch (e) {
                console.warn('Audio playback blocked:', e);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen?.();
            } else {
                document.exitFullscreen?.();
            }
        }

        function setGstRate(id, rate) {
            gstRates[id] = Number(rate) || 0;
            drawOrders();
        }

        async function setOrderStatus(id, status) {
            const order = currentOrders.find(item => String(item.id) === String(id));
            if (!order) return;
            try {
                const response = await fetch(`/api/orders/${encodeURIComponent(id)}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if (!response.ok) throw new Error('Status update failed');
                order.status = status;
                drawOrders();
                if (status === 'Completed') printEBill(id);
            } catch (error) {
                setConnection(false);
                alert('Could not update the order. Please try again.');
            }
        }

        function printEBill(id) {
            const order = currentOrders.find(item => String(item.id) === String(id));
            if (!order) return;
            const billWindow = window.open('', '_blank', 'width=800,height=900');
            if (!billWindow) return alert('Please allow pop-ups to generate the e-bill PDF.');

            const itemRows = (order.items || []).map(item => {
                const quantity = Number(item.qty) || 0;
                const price = Number(item.price) || 0;
                return `<tr><td>${safe(item.name)}</td><td class="number">${quantity}</td><td class="number">₹${price.toFixed(2)}</td><td class="number">₹${(price * quantity).toFixed(2)}</td></tr>`;
            }).join('');

            const subtotal = Number(order.total) || (order.items || []).reduce((sum, item) => sum + (Number(item.price) || 0) * (Number(item.qty) || 0), 0);
            const gstRate = Number(gstRates[id] ?? 0);
            const gstAmount = subtotal * gstRate / 100;
            const billTotal = subtotal + gstAmount;

            billWindow.document.write(`<!doctype html><html><head><title>E-bill ${safe(order.id)}</title><style>body{font-family:Arial,sans-serif;color:#222;max-width:760px;margin:32px auto;padding:0 24px}h1{margin:0;color:#b45309;font-size:28px}.muted{color:#666;font-size:13px}.header{display:flex;justify-content:space-between;border-bottom:2px solid #b45309;padding-bottom:16px}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:22px 0;font-size:14px}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:10px 8px;border-bottom:1px solid #ddd;text-align:left}th{background:#fef3c7}.number{text-align:right}.summary{text-align:right;margin-top:20px;line-height:1.8}.total{font-size:20px;font-weight:bold;text-align:right;margin-top:8px;border-top:2px solid #222;padding-top:12px}.thanks{text-align:center;margin-top:48px;color:#666}@media print{body{margin:0 auto}.no-print{display:none}}</style></head><body><div class="header"><div><h1>Mama Mia Artisan Kitchen</h1><div class="muted">E-bill / Payment Receipt</div></div><div style="text-align:right"><b>${safe(order.id)}</b><br><span class="muted">${safe(new Date().toLocaleString('en-IN'))}</span></div></div><div class="details"><div><b>Customer:</b> ${safe(order.customerName || 'Guest')}</div><div><b>Table:</b> ${safe(order.table)}</div><div><b>Phone:</b> ${safe(order.customerPhone || '-')}</div><div><b>Status:</b> Completed</div></div><table><thead><tr><th>Item</th><th class="number">Qty</th><th class="number">Price</th><th class="number">Amount</th></tr></thead><tbody>${itemRows}</tbody></table><div class="summary"><div>Subtotal: ₹${subtotal.toFixed(2)}</div><div>GST (${gstRate}%): ₹${gstAmount.toFixed(2)}</div></div><div class="total">Grand Total: ₹${billTotal.toFixed(2)}</div><p class="thanks">Thank you for dining with us!</p><button class="no-print" onclick="window.print()">Print / Save as PDF</button><script>window.onload=()=>setTimeout(()=>window.print(),300);<\/script></body></html>`);
            billWindow.document.close();
        }

        async function notifyReady(id) {
            const order = currentOrders.find(item => String(item.id) === String(id));
            if (!order) return;

            const checkboxes = [...document.querySelectorAll('input[type="checkbox"]:checked')]
                .filter(input => input.dataset.readyFor === String(id));
            const selected = checkboxes
                .map(input => order.items[Number(input.dataset.itemIndex)])
                .filter(Boolean);

            if (!selected.length) return alert('Please tick at least one ready item.');

            const allReady = selected.length === (order.items || []).length;
            const nextStatus = allReady ? 'Ready' : 'Preparing (Partial)';

            try {
                const response = await fetch(`/api/orders/${encodeURIComponent(id)}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: nextStatus })
                });
                if (!response.ok) throw new Error('Status update failed');
                order.status = nextStatus;
                drawOrders();

                if (order.customerPhone) {
                    const itemText = selected.map(item => `• ${item.name} x${item.qty}`).join('\n');
                    const rawMessage = `*🍕 Items Ready - Mama Mia Artisan Kitchen*\n\nHi *${order.customerName || 'Customer'}*, these items from your order for *Table #${order.table}* are ready:\n\n${itemText}\n\nPlease collect them from the counter. Thank you!`;
                    window.open(`https://wa.me/${order.customerPhone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(rawMessage)}`, '_blank');
                }
            } catch (error) {
                setConnection(false);
                alert('Could not update the ready items. Please try again.');
            }
        }
    </script>
</body>
</html>
